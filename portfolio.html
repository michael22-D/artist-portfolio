    <title>Portfolio | Michael Denso</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="portfolio">
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="brand" aria-label="Michael Denso home page">
          <span class="brand-name">Michael Denso</span>
          <span class="brand-subtitle">ABSTRACT ARTIST</span>
        </a>

        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"

          <div id="galleryEmptyState" class="empty-state hidden" aria-live="polite">
